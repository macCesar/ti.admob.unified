
dependencies {
	// Core Google Mobile Ads SDK
	implementation 'com.google.android.gms:play-services-ads:25.4.0'

	// User Messaging Platform SDK for GDPR/CCPA/UMP consent
	implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

	// AdMob mediation adapters. Each coordinate brings the matching network SDK.
	implementation 'com.google.ads.mediation:facebook:6.21.0.4'
	implementation 'com.google.ads.mediation:inmobi:11.4.0.0'
	implementation 'com.google.ads.mediation:unity:4.19.0.0'
	implementation 'com.google.ads.mediation:applovin:13.6.3.0'
	implementation 'com.google.ads.mediation:vungle:7.7.6.0'
	implementation 'com.google.ads.mediation:ironsource:9.5.0.0'
}
